# ============================================================
# Gymfreek - Compose DEV
# ============================================================
# Runs ONLY Postgres. Next.js runs locally via
# `npm run dev` for native hot-reload.
#
# For prod (all in Docker): see docker-compose.prod.yml

services:
  db:
    image: postgres:16-alpine
    container_name: gymfreek-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymfreek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymfreek_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-gymfreek}
    ports:
      # Décalé en 5433 sur l'hôte pour éviter conflit avec Postgres système ou
      # autre projet déjà sur 5432. Côté conteneur on reste en 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gymfreek} -d ${POSTGRES_DB:-gymfreek}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
